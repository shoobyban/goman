version: 2

project_name: goman

builds:
  - id: goman
    main: .
    binary: goman
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: internal/gocui/LICENSE
        dst: licenses/gocui/LICENSE
      - src: internal/gocui/AUTHORS
        dst: licenses/gocui/AUTHORS
      - src: internal/gocui/UPSTREAM.md
        dst: licenses/gocui/UPSTREAM.md

nfpms:
  - id: debian
    package_name: goman
    homepage: https://github.com/shoobyban/goman
    maintainer: shoobyban <shoobyban@users.noreply.github.com>
    description: Terminal HTTP client and webhook inspector
    license: MIT AND BSD-3-Clause
    section: net
    priority: optional
    formats:
      - deb
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    contents:
      - src: LICENSE
        dst: /usr/share/doc/goman/LICENSE
      - src: README.md
        dst: /usr/share/doc/goman/README.md
      - src: internal/gocui/LICENSE
        dst: /usr/share/doc/goman/licenses/gocui/LICENSE
      - src: internal/gocui/AUTHORS
        dst: /usr/share/doc/goman/licenses/gocui/AUTHORS
      - src: internal/gocui/UPSTREAM.md
        dst: /usr/share/doc/goman/licenses/gocui/UPSTREAM.md

homebrew_casks:
  - name: goman
    repository:
      owner: shoobyban
      name: goman
    homepage: https://github.com/shoobyban/goman
    description: Terminal HTTP client and webhook inspector
    skip_upload: true
    binaries:
      - goman

checksum:
  name_template: checksums.txt

release:
  name_template: "goman {{ .Tag }}"
  extra_files:
    - glob: dist/**/goman.rb